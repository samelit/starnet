<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Scanner</title><style>
body{margin:0;background:#161512;color:#ddd;font:15px sans-serif}main{max-width:480px;margin:auto;padding:8px}
#bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;border:2px solid #444;user-select:none;-webkit-user-select:none}
.c{min-width:0;min-height:0;overflow:hidden;cursor:pointer;background-size:92% 92%;background-position:center;background-repeat:no-repeat}
.l{background-color:#f0d9b5}.d{background-color:#b58863}.c.hl{box-shadow:inset 0 0 0 3px #6c6}
#pal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:6px 0}
#pal div{aspect-ratio:1;background:#262421 center/90% no-repeat;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px}
#pal div.on{background-color:#3a7a3a}
button,select,input[type=text]{background:#302e2b;color:#eee;border:0;border-radius:6px;padding:9px 11px;margin:2px;font-size:14px}
button.p{background:#3a7a3a}#fen{width:100%;box-sizing:border-box;font-family:monospace}
canvas{width:100%;background:#000;border-radius:6px}label{display:block;margin:3px 0}input[type=range]{width:70%;vertical-align:middle}
h3{margin:12px 0 4px}#ev{font-size:17px;margin:6px 0}small{color:#999;font-size:12px}
</style></head><body><main>
<h3>♞ Chess Scanner</h3>
<div id="bd"></div><div id="pal"></div>
<div><button id="fl">⇅ Перевернуть</button><button id="cl">Очистить</button><button id="st">Начальная</button>
<select id="tn"><option value="w">Ход белых</option><option value="b">Ход чёрных</option></select>
<input id="ca" type="text" value="KQkq" size="4"></div>
<h3>FEN</h3><input id="fen" type="text" readonly>
<div><button id="cp" class="p">Копировать FEN</button><button id="li">Lichess</button><button id="sh">Поделиться</button></div>
<h3>Stockfish (локально)</h3>
<div><select id="dp"><option>10</option><option selected>14</option><option>18</option></select><button id="an" class="p">Анализ</button><button id="sp">Стоп</button></div>
<div id="ev">—</div>
<h3>Сканер</h3>
<div><button id="cam" class="p">📷 Камера</button><label style="display:inline-block;background:#302e2b;padding:9px 11px;border-radius:6px;margin:2px">🖼 Галерея<input id="fi" type="file" accept="image/*" hidden></label>
<label style="display:inline"><input id="lv" type="checkbox"> Live</label></div>
<canvas id="cv" width="320" height="240"></canvas>
<label>X <input id="rx" type="range" min="0" max="100" value="10"></label>
<label>Y <input id="ry" type="range" min="0" max="100" value="10"></label>
<label>Размер <input id="rs" type="range" min="10" max="100" value="80"></label>
<button id="sc" class="p">Распознать</button> <small id="cf"></small>
